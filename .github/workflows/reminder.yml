name: Run WhatsApp Reminder

on:
  schedule:
    - cron: '*/5 * * * *'  # wa_reminder: every 5 minutes
  workflow_dispatch:

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pytz; fi

      - name: Run wa_reminder
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GCAL_CREDENTIALS: ${{ secrets.GCAL_CREDENTIALS }}
        run: python send_invoice_email.py

      - name: Run KeepTheFlow notifier
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python keeptheflow_notifier.py
